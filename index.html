<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>نرم‌افزار مدیریت شارژ ساختمان</title>

<!-- آیکون برای صفحه اصلی آیفون (Add to Home Screen در سافاری) -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="شارژ ساختمان">
<meta name="theme-color" content="#0a1c42">

<!-- فونت فارسی (جایگزین باز برای IRANSansX در صورت نبود فایل لوکال فونت) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Bootstrap 5 RTL -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- استایل اختصاصی برنامه -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <!-- ================= Sidebar ================= -->
  <aside class="app-sidebar">
    <div class="sidebar-brand">
      <img id="sidebarLogo" alt="لوگو">
      <div>
        <div class="brand-text" id="sidebarBuildingName">ساختمان نمونه</div>
        <div class="brand-sub">مدیریت شارژ ساختمان</div>
      </div>
    </div>
    <nav class="app-nav">
      <a class="nav-link" data-page="dashboard">
        <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/></svg>
        داشبورد</a>
      <a class="nav-link" data-page="units">
        <svg class="nav-icon" viewBox="0 0 24 24"><rect x="4.5" y="3.5" width="15" height="17" rx="1.2"/><line x1="8" y1="7.5" x2="8" y2="7.5"/><line x1="12" y1="7.5" x2="12" y2="7.5"/><line x1="16" y1="7.5" x2="16" y2="7.5"/><line x1="8" y1="11.5" x2="8" y2="11.5"/><line x1="12" y1="11.5" x2="12" y2="11.5"/><line x1="16" y1="11.5" x2="16" y2="11.5"/><path d="M10 20.5v-4.5h4v4.5"/></svg>
        واحدها</a>
      <a class="nav-link" data-page="receipts">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M4.5 19.5h15"/></svg>
        دریافت‌ها</a>
      <a class="nav-link" data-page="expenses">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 20V9"/><path d="M7.5 13.5 12 9l4.5 4.5"/><path d="M4.5 4.5h15"/></svg>
        هزینه‌ها</a>
      <a class="nav-link" data-page="charges">
        <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="1.6"/><line x1="3.5" y1="9.5" x2="20.5" y2="9.5"/><line x1="8" y1="3" x2="8" y2="6.5"/><line x1="16" y1="3" x2="16" y2="6.5"/><path d="M8.5 14.5l2 2 4.5-4.5"/></svg>
        شارژ ماهانه</a>
      <a class="nav-link" data-page="persons">
        <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.3"/><path d="M5 20c1.4-4.2 4.8-6 7-6s5.6 1.8 7 6"/></svg>
        اشخاص</a>
      <a class="nav-link" data-page="ledger">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4.5 5.2c0-1 .9-1.7 1.9-1.7H12v17.2H6.4c-1 0-1.9-.8-1.9-1.7z"/><path d="M19.5 5.2c0-1-.9-1.7-1.9-1.7H12v17.2h5.6c1 0 1.9-.8 1.9-1.7z"/></svg>
        دفتر معین</a>
      <a class="nav-link" data-page="reports">
        <svg class="nav-icon" viewBox="0 0 24 24"><line x1="5.5" y1="20.5" x2="5.5" y2="12.5"/><line x1="12" y1="20.5" x2="12" y2="7"/><line x1="18.5" y1="20.5" x2="18.5" y2="15.5"/><line x1="3.5" y1="20.5" x2="20.5" y2="20.5"/></svg>
        گزارشات</a>
      <a class="nav-link" data-page="settings">
        <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.8"/><path d="M12 3v3M12 18v3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M3 12h3M18 12h3M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
        تنظیمات</a>
      <a class="nav-link" data-page="backup">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M7.2 17.8a4 4 0 0 1-.9-7.9 5 5 0 0 1 9.6-2.1A4.4 4.4 0 0 1 16.8 16"/><path d="M12 11.5v7"/><path d="M9 15.5l3 3 3-3"/></svg>
        پشتیبان گیری</a>
    </nav>
    <div class="p-3 text-center small" style="color:var(--sidebar-text)" id="appVersion"></div>
  </aside>

  <!-- ================= Main ================= -->
  <main class="app-main">
    <header class="app-topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-outline-secondary d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
        <h5 class="m-0" id="pageTitle">داشبورد</h5>
      </div>
      <div id="topbarActions"></div>
    </header>

    <div class="app-content">
      <div class="page-content" id="page-dashboard"></div>
      <div class="page-content" id="page-units"></div>
      <div class="page-content" id="page-receipts"></div>
      <div class="page-content" id="page-expenses"></div>
      <div class="page-content" id="page-charges"></div>
      <div class="page-content" id="page-persons"></div>
      <div class="page-content" id="page-ledger"></div>
      <div class="page-content" id="page-reports"></div>
      <div class="page-content" id="page-settings"></div>
      <div class="page-content" id="page-backup"></div>
    </div>
  </main>
</div>

<!-- محل قرارگیری مودال‌ها -->
<div id="modalRoot"></div>
<!-- محل قرارگیری Toast ها -->
<div id="toastContainer"></div>

<!-- ================= کتابخانه‌های جاوااسکریپت ================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.11/dayjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- ================= اسکریپت‌های اختصاصی برنامه (ترتیب بارگذاری مهم است) ================= -->
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/ledger.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/units.js"></script>
<script src="js/receipts.js"></script>
<script src="js/expenses.js"></script>
<script src="js/charges.js"></script>
<script src="js/persons.js"></script>
<script src="js/reports.js"></script>
<script src="js/settings.js"></script>
<script src="js/backup.js"></script>
<script src="js/app.js"></script>

</body>
</html>
